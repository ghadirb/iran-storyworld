name: Build Android App

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: "0.1.${{ github.run_number }}"
      API_BASE: ${{ vars.API_BASE }}
      APP_KEY: ${{ secrets.APP_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode signing key (if provided)
        id: key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK (for testing)
        working-directory: android
        shell: bash
        run: gradle --no-daemon --console=plain assembleDebug 2>&1 | tee build-debug.log

      - name: Build signed release APK (for Myket)
        if: steps.key.outputs.has_key == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: gradle --no-daemon --console=plain assembleRelease 2>&1 | tee build-release.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: riwayat-iran-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release APK
        if: steps.key.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: riwayat-iran-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish build log to ci-logs branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/l
          cp android/build-*.log /tmp/l/ 2>/dev/null || true
          ls -la android/app/build/outputs/apk/*/ > /tmp/l/apk-list.txt 2>&1 || true
          git config user.name "ci-bot"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf . -q
          cp /tmp/l/* . 2>/dev/null || true
          echo "run ${{ github.run_id }}" > RUN.txt
          git add -A
          git commit -qm "build log ${{ github.run_id }}"
          git push -f origin ci-logs
