name: Build Android App

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: "0.1.${{ github.run_number }}"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build episode videos
        run: |
          python3 tools/build_ep01_draft_v4.py
          python3 tools/build_ep02_draft_v2.py
          ls -la out

      - name: Prepare app assets (compressed videos + posters)
        run: |
          A=android/app/src/main/assets
          mkdir -p $A/videos $A/posters
          enc() { ffmpeg -y -i "$1" -c:v libx264 -crf 26 -preset medium -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "$2"; }
          enc out/ep01_draft_v4.mp4 $A/videos/ep01.mp4
          enc out/ep02_preview_v2.mp4 $A/videos/ep02.mp4
          for e in ep01 ep02; do
            ffmpeg -y -ss 6 -i $A/videos/$e.mp4 -frames:v 1 -vf scale=640:-2 -q:v 4 $A/posters/$e.jpg
          done
          ls -la $A/videos $A/posters

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode signing key (if provided)
        id: key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK (for testing)
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Build signed release APK (for Myket)
        if: steps.key.outputs.has_key == 'true'
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: riwayat-iran-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release APK
        if: steps.key.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: riwayat-iran-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
