name: Cloudflare token check (one-time)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify candidate tokens (no secrets printed)
        env:
          T1: ${{ secrets.CF_CAND_WORKERS }}
          T2: ${{ secrets.CF_CAND_4 }}
          T3: ${{ secrets.CF_CAND_DASH }}
        run: |
          A=1609c905e10f5c9a6cf1a0cb240f356f
          i=0
          for t in "$T1" "$T2" "$T3"; do
            i=$((i+1))
            w=$(curl -s -H "Authorization: Bearer $t" "https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("workers:", d.get("success"), [e.get("message") for e in d.get("errors",[])])')
            k=$(curl -s -H "Authorization: Bearer $t" "https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("kv:", d.get("success"))')
            r=$(curl -s -H "Authorization: Bearer $t" "https://api.cloudflare.com/client/v4/accounts/$A/r2/buckets" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("r2:", d.get("success"), [(e.get("code"),e.get("message")) for e in d.get("errors",[])])')
            s=$(curl -s -H "Authorization: Bearer $t" "https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("subdomain:", d.get("result"))')
            echo "::notice title=cand$i::$w | $k | $r | $s"
          done
