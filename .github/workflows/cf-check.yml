name: Cloudflare token check (one-time)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify candidate tokens (no secrets printed)
        env:
          T1: ${{ secrets.CF_CAND_WORKERS }}
          T2: ${{ secrets.CF_CAND_4 }}
          T3: ${{ secrets.CF_CAND_DASH }}
        run: |
          i=0
          for t in "$T1" "$T2" "$T3"; do
            i=$((i+1)); echo "== candidate $i"
            echo -n "verify: "; curl -s -H "Authorization: Bearer $t" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("success"), d.get("result",{}).get("status"), [e.get("message") for e in d.get("errors",[])])'
            echo -n "accounts: "; curl -s -H "Authorization: Bearer $t" https://api.cloudflare.com/client/v4/accounts | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("success"), [(a["id"],a["name"]) for a in d.get("result",[])])'
          done
