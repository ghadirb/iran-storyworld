name: Publish episodes (KV, multi-account)

on:
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "ساخت دوبارهٔ همهٔ قسمت‌ها (نادیده‌گرفتن کش)"
        type: boolean
        default: false
  push:
    paths:
      - "catalog/**"
      - "tools/**"
      - "episodes/**"
      - "assets/**"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CF_ACCOUNTS: ${{ secrets.CF_ACCOUNTS }}
      PRIMARY_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Restore build cache (incremental builds)
        uses: actions/cache/restore@v4
        with:
          path: build-cache
          key: episodes-none
          restore-keys: |
            episodes-
      - name: Build and encode episodes (only changed ones)
        shell: bash
        env:
          REBUILD_ALL: ${{ inputs.rebuild_all }}
          ENC_TAG: crf26-medium-v1
        run: bash tools/build_all.sh
      - name: Save build cache
        if: always() && env.BUILT_NEW == '1'
        uses: actions/cache/save@v4
        with:
          path: build-cache
          key: episodes-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload to KV (spills to the next account when one is full)
        run: python3 tools/kv_store.py sync build/manifest.txt
