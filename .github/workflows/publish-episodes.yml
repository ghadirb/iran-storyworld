name: Publish episodes to R2

on:
  workflow_dispatch:
  push:
    paths:
      - "catalog/**"
      - "tools/**"
      - "episodes/**"
      - "assets/**"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: riwayat-media
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build, encode, upload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out build
          up() { npx --yes wrangler@4 r2 object put "$BUCKET/$1" --file "$2" --content-type "$3" --remote; }
          grep -v '^\s*#' tools/build_map.txt | grep -v '^\s*$' | while read -r id script outfile; do
            echo "== $id"
            python3 "tools/$script"
            ffmpeg -y -loglevel error -i "$outfile" -c:v libx264 -crf 26 -preset medium -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "build/$id.mp4"
            ffmpeg -y -loglevel error -ss 6 -i "build/$id.mp4" -frames:v 1 -vf scale=640:-2 -q:v 4 "build/$id.jpg"
            up "videos/$id.mp4" "build/$id.mp4" video/mp4
            up "posters/$id.jpg" "build/$id.jpg" image/jpeg
          done
          # کاتالوگ آخر آپلود می‌شود تا قسمت فقط بعد از آماده‌شدن فایل‌هایش دیده شود
          up catalog.json catalog/catalog.json application/json
