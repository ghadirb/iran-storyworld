name: Publish episodes (KV, multi-account)

on:
  workflow_dispatch:
  push:
    paths:
      - "catalog/**"
      - "tools/**"
      - "episodes/**"
      - "assets/**"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CF_ACCOUNTS: ${{ secrets.CF_ACCOUNTS }}
      PRIMARY_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build and encode episodes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out build
          : > build/manifest.txt
          grep -v '^\s*#' tools/build_map.txt | grep -v '^\s*$' | while read -r id script outfile; do
            echo "== $id"
            python3 "tools/$script"
            ffmpeg -y -loglevel error -i "$outfile" -c:v libx264 -crf 26 -preset medium -pix_fmt yuv420p -c:a aac -b:a 128k -movflags +faststart "build/$id.mp4"
            ffmpeg -y -loglevel error -ss 6 -i "build/$id.mp4" -frames:v 1 -vf scale=640:-2 -q:v 4 "build/$id.jpg"
            echo "videos/$id.mp4 build/$id.mp4 video/mp4" >> build/manifest.txt
            echo "posters/$id.jpg build/$id.jpg image/jpeg" >> build/manifest.txt
          done
          # کاتالوگ آخر می‌آید تا قسمت فقط بعد از آماده‌شدن فایل‌هایش دیده شود
          echo "catalog.json catalog/catalog.json application/json" >> build/manifest.txt
          ls -la build
      - name: Upload to KV (spills to the next account when one is full)
        run: python3 tools/kv_store.py sync build/manifest.txt
